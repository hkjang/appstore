<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AppStore API 문서</title>
    <meta name="description" content="AppStore REST API와 MCP endpoint의 오프라인 API 문서" />
    <link rel="stylesheet" href="/docs/style.css" />
    <script src="/docs/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#content">본문으로 건너뛰기</a>
    <header>
      <a href="/" class="brand" aria-label="AppStore 홈">A</a>
      <div><strong>AppStore API</strong><span>OpenAPI 3.1 · 오프라인 문서</span></div>
      <a class="json-link" href="/openapi.json">원본 JSON</a>
    </header>
    <main id="content">
      <section class="hero">
        <p class="eyebrow">Developer Platform</p>
        <h1>REST API와 MCP를 한곳에서 확인하세요.</h1>
        <p>공개 조회는 인증 없이 사용할 수 있습니다. 변경 API는 SSO 세션 또는 권한이 제한된 <code>aps_</code> 개인 키를 사용합니다.</p>
      </section>
      <div class="toolbar">
        <label for="filter">Endpoint 검색</label>
        <input id="filter" type="search" placeholder="apps, keys, workflow…" autocomplete="off" />
      </div>
      <p id="status" role="status" aria-live="polite">API 명세를 불러오는 중입니다.</p>
      <div id="endpoints" class="endpoints"></div>
      <noscript><p>Endpoint 목록에는 JavaScript가 필요합니다. <a href="/openapi.json">OpenAPI JSON</a>을 직접 확인하세요.</p></noscript>
    </main>
  </body>
</html>
