name: Release offline Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish appstore image archive
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and commit
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        run: |
          npm --prefix web ci --no-audit --no-fund
          go test . ./cmd/... ./internal/... ./migrations/... ./openapi/...
          npm --prefix web test
          npm --prefix web run build
          ./scripts/check-offline-assets.sh web/dist
          ./scripts/check-env-contract.sh
          ./scripts/check-docs.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact image and archive names
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/release-image.sh "$VERSION"

      - name: Test loaded image without internet egress
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/smoke-image.sh "appstore:$VERSION"

      - name: Create release notes with archive digest
        id: digest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="artifacts/appstore-$VERSION.tar.gz"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          echo "sha256=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "## AppStore $VERSION"
            echo
            echo "Offline-loadable Linux/AMD64 service image: \`appstore:$VERSION\`."
            echo
            echo "\`appstore-$VERSION.tar.gz\` SHA-256: \`$digest\`"
            echo
            echo '```bash'
            echo "gzip -dc appstore-$VERSION.tar.gz | docker load"
            echo "docker image inspect appstore:$VERSION"
            echo '```'
            echo
            echo "Only the AppStore service image is uploaded as a custom asset. PostgreSQL, Keycloak, and AI provider images are not bundled. GitHub adds its standard source-code links automatically."
          } >release-notes.md

      - name: Publish GitHub Release with one custom asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "artifacts/appstore-$VERSION.tar.gz#appstore:$VERSION offline Docker image" \
            --verify-tag \
            --title "AppStore $VERSION" \
            --notes-file release-notes.md
          asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.assets | length')"
          asset_name="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.assets[0].name')"
          test "$asset_count" = "1"
          test "$asset_name" = "appstore-$VERSION.tar.gz"
